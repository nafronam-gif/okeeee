<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOKI BWS - Pilih Mode Joki</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Inter', sans-serif; background: #eef2ff; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; color: #1a1f36; }
    .container { text-align: center; max-width: 800px; padding: 20px; }
    h1 { font-size: 48px; font-weight: 900; margin-bottom: 10px; letter-spacing: -1.5px; color: #0f6cff; }
    p { color: #6b7280; font-size: 18px; margin-bottom: 40px; }
    .modes { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .mode-card { background: white; border: 2px solid #e5e7eb; border-radius: 20px; padding: 40px; width: 280px; cursor: pointer; transition: all 0.3s; text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; }
    .mode-card:hover { border-color: #0f6cff; transform: translateY(-5px); box-shadow: 0 15px 30px rgba(15,108,255,0.1); }
    .mode-icon { font-size: 60px; margin-bottom: 20px; }
    .mode-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .mode-card:hover .mode-title { color: #0f6cff; }
    .mode-desc { font-size: 14px; color: #6b7280; }
</style>
</head>
<body>
<div class="container">
    <h1>JOKI BWS</h1>
    <p>Pilih mode layanan joki Free Fire yang kamu butuhkan.</p>
    <div class="modes">
        <a href="br.html" class="mode-card">
            <div class="mode-icon">🏆</div>
            <div class="mode-title">BR Rank</div>
            <div class="mode-desc">Battle Royale (Per Tier)</div>
        </a>
        <a href="cs.html" class="mode-card">
            <div class="mode-icon">🎯</div>
            <div class="mode-title">CS Rank</div>
            <div class="mode-desc">Clash Squad (Per Bintang)</div>
        </a>
    </div>
</div>
</body>
</html>
